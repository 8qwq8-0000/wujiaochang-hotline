name: Assemble signed Android preview
on:
  push:
    branches: [codex/mobile-release-preview]
    paths: [.github/workflows/assemble-android-preview.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for parts and assemble the already signed APK
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, time
          tag = 'v0.1.1-mobile-preview.1'
          names = [f'_android-upload-{i:02d}.part' for i in range(8)]
          for attempt in range(180):
              result = subprocess.run(['gh', 'release', 'view', tag, '--json', 'assets'], capture_output=True, text=True)
              assets = json.loads(result.stdout)['assets'] if result.returncode == 0 else []
              ready = {a['name'] for a in assets if a['state'] == 'uploaded'}
              if all(name in ready for name in names):
                  break
              time.sleep(5)
          else:
              raise SystemExit('Upload parts did not arrive within 15 minutes')
          directory = pathlib.Path('/tmp/android-parts')
          directory.mkdir()
          subprocess.run(['gh', 'release', 'download', tag, '--pattern', '_android-upload-*.part', '--dir', str(directory)], check=True)
          apk = pathlib.Path('/tmp/wujiaochang-hotline-android-v0.1.1-mobile-preview.1.apk')
          with apk.open('wb') as output:
              for name in names:
                  output.write((directory / name).read_bytes())
          assert apk.stat().st_size == 150221456
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == '9208a15c701060bcfa326fd58a025cc97b792795a18b9a427e9f6a43b45706b3'
          subprocess.run(['gh', 'release', 'upload', tag, str(apk), '--clobber'], check=True)
          for name in names:
              subprocess.run(['gh', 'release', 'delete-asset', tag, name, '--yes'], check=True)
          print('Signed APK assembled, SHA-256 verified, uploaded; temporary parts removed. Release remains draft for final verification.')
